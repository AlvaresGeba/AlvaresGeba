# The only datasource: prometheus on the grafana network. The fixed uid is
# referenced by dashboards/geba.json.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      # List prometheus' own alerting rules (monitoring/rules) under
      # Alerting > Alert rules as data source-managed rules. They are
      # read-only there: Prometheus has no ruler API, rules are edited in
      # git.
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 3.5.0
