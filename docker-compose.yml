# orchestrator -> agents (executor) -> tools (host, phone)
#
# orchestrator - gateway.py (mTLS, the only exposed port): the phone app's
#                API, elevation (lifting the restrictions, approved only
#                from the phone), history, logs. Hands every command to an
#                agent; runs no model and no tools itself. Relays the
#                phone's control WebSocket to the phone service.
# whisper      - speech-to-text (stt_service.py), for the orchestrator.
# executor     - the agent (executor_agent.py): Claude Code runs here, with
#                the cluster tools (mcp_command_server.py, every command
#                checked against commands_whitelist.md, run on the host over
#                SSH) and the phone service's tools.
# phone        - the phone link (phone_service.py): the phone's WebSocket and
#                the tools that drive it, nothing else.
# prometheus   - scrapes only orchestrator:9100 (a metrics-only server:
#                GET /metrics, nothing else) and keeps 30 days; evaluates
#                the alerting rules in monitoring/rules (no Alertmanager,
#                no notifications: alerts are only shown in its UI and in
#                grafana); UI on host loopback 127.0.0.1:9090.
# grafana      - dashboards over prometheus' data (provisioned from
#                monitoring/grafana, read-only); UI on host loopback
#                127.0.0.1:3000, admin login from GRAFANA_ADMIN_PASSWORD.
#
# Networks: whisper talks only to the orchestrator (stt); the executor to
# the orchestrator (exec, which also reaches the host and the internet for
# Claude); the phone service only to those two (phonelink, internal);
# prometheus to the orchestrator (monitoring, fixed subnet) and to grafana
# (grafana). The orchestrator's internal port 8001 listens on all its
# networks, so it refuses (403) clients from the monitoring subnet
# (INTERNAL_DENY_SUBNETS): prometheus cannot reach /internal/elevation*.
# monitoring is not an internal network - docker publishes no ports from a
# container whose only network is internal, and the UI is published on
# 127.0.0.1:9090 - so prometheus does have egress to the internet. grafana
# talks only to prometheus (grafana network) and never joins monitoring, so
# it cannot reach the orchestrator. grafana is not internal either (its UI
# is published on 127.0.0.1:3000), so it has egress to the internet; update
# checks, plugin preinstall, news and telemetry are switched off.
#
# Claude uses the same login as `claude` in your terminal: your ~/.claude is
# mounted into the executor, which runs as your uid. Log in once on the
# host (`claude`, then /login), set up host access once
# (`sudo host/setup-host-access.sh`), then:
#
#   docker compose up -d --build

services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    restart: unless-stopped
    # Your uid/gid: certs/server.key is readable only by you.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      GATEWAY_HOST: 0.0.0.0
      STT_URL: http://whisper:9000
      EXECUTOR_URL: http://executor:8000
      PHONE_URL: http://phone:8002
      # Internal server: the elevation state for the executor, the phone
      # service and host/geba-root.
      INTERNAL_HOST: 0.0.0.0
      # The monitoring network (prometheus) may not use the internal
      # server; keep in sync with networks.monitoring below.
      INTERNAL_DENY_SUBNETS: 172.31.250.0/28
      # Metrics-only server (GET /metrics) for prometheus. Not published.
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9100"
      DATA_DIR: /app/data
      # Optional PIN asked on the phone when approving a voice request to
      # lift the restrictions.
      ELEVATION_PIN: ${ELEVATION_PIN:-}
    ports:
      # Published on the VPN address only, as before.
      - "${GATEWAY_BIND:-100.99.129.107}:8443:8443"
      # host/geba-root asks the elevation level here. Host loopback only.
      - "127.0.0.1:8001:8001"
    volumes:
      - ./certs:/app/certs:ro
      - orchestrator-data:/app/data
      # Tailed into the app's Logs screen.
      - ./command_audit.log:/app/command_audit.log:ro
    networks:
      # default carries the published ports and the default route: the
      # highest gw_priority keeps host connections to 127.0.0.1:8001 from
      # arriving via the monitoring gateway (which INTERNAL_DENY_SUBNETS
      # refuses).
      default:
        gw_priority: 100
      stt:
      exec:
      phonelink:
      monitoring:
    depends_on:
      whisper:
        condition: service_healthy
      executor:
        condition: service_healthy
      phone:
        condition: service_healthy

  executor:
    build:
      context: .
      dockerfile: docker/executor.Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
    restart: unless-stopped
    # Your uid/gid: Claude writes into your ~/.claude, the audit log on the
    # host is yours.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # Empty = Claude Code's default; e.g. claude-haiku-5-5
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      PHONE_MCP_URL: http://phone:8002/mcp
      ELEVATION_URL: http://orchestrator:8001/internal/elevation
      # systemd units to show on the app's Server screen, e.g. "nginx,ssh"
      MONITOR_UNITS: ${MONITOR_UNITS:-}
      # target "local" = this host, over SSH as geba-exec. Set up once with
      # `sudo host/setup-host-access.sh` (writes ./ssh).
      HOST_SSH: host.docker.internal
      SSH_CONFIG: /app/ssh/config
      HOST_SCRIPTS_DIR: ${PROJECT_DIR:-${PWD}}/scripts
      # More nodes: "node2=admin@10.0.0.2,..."
      CLUSTER_NODES: ${CLUSTER_NODES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/.claude:/home/executor/.claude
      - ./commands_whitelist.md:/app/commands_whitelist.md:ro
      - ./scripts:/app/scripts:ro
      - ./command_audit.log:/app/command_audit.log
      - ./ssh:/app/ssh:ro
      # The node's real name for the Server screen (without HOST_SSH).
      - /etc/hostname:/host/hostname:ro
    # No published ports. exec is not an internal network: Claude needs the
    # internet, run_command SSHes to the host and other cluster nodes.
    networks: [exec, phonelink]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  phone:
    build:
      context: .
      dockerfile: docker/phone.Dockerfile
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # Host header the executor sends to /mcp; anything else is refused.
      PHONE_ALLOWED_HOSTS: "phone:*"
      ELEVATION_URL: http://orchestrator:8001/internal/elevation
      # Apps never driven, added to the phone's own list (comma-separated);
      # empty = the defaults in phone_hub.py.
      PHONE_DENY_PACKAGES: ${PHONE_DENY_PACKAGES:-}
    networks: [phonelink]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  whisper:
    build:
      context: .
      dockerfile: docker/stt.Dockerfile
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-small}
      STT_LANGUAGE: ${STT_LANGUAGE:-ru}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-4}
      STT_MODEL_DIR: /models
    volumes:
      - whisper-models:/models
    networks: [stt]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m  # first start downloads the Whisper model

  prometheus:
    # Multi-arch index digest of v3.5.0.
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    # nobody, as in the image; the data volume must be writable by it.
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 64
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alerting rules; reload with `docker compose kill -s HUP prometheus`.
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      # Host loopback only.
      - "127.0.0.1:9090:9090"
    # monitoring: scrapes the orchestrator; grafana: queried by grafana
    # only. Its address on grafana is outside INTERNAL_DENY_SUBNETS, but
    # the orchestrator is not on that network, so it cannot use it.
    networks: [monitoring, grafana]

  grafana:
    # Multi-arch index digest of 12.0.2.
    image: grafana/grafana-oss:12.0.2@sha256:b5b59bfc7561634c2d7b136c4543d702ebcc94a3da477f21ff26f89ffd4214fa
    restart: unless-stopped
    # grafana, as in the image; the data volume must be writable by it.
    user: "472:472"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # No background plugin downloads (Grafana 12 preinstalls some apps).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Grafana has internet egress: no plugin installs from the UI, no
      # datasource proxying beyond prometheus, nothing published outside.
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SECURITY_DATA_SOURCE_PROXY_WHITELIST: "prometheus:9090"
      GF_SNAPSHOTS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Reached through an SSH tunnel on localhost.
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_SECURITY_COOKIE_SAMESITE: strict
      # Read-only rootfs: everything writable lives in the data volume
      # (or /tmp); logs go to stdout only.
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_LOGS: /var/lib/grafana/logs
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_LOG_MODE: console
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Outside the data volume; see provisioning/dashboards/geba.yml.
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Host loopback only.
      - "127.0.0.1:3000:3000"
    networks: [grafana]
    depends_on: [prometheus]

volumes:
  whisper-models:
  orchestrator-data:
  prometheus-data:
  grafana-data:

networks:
  stt:
  exec:
  phonelink:
    internal: true
  # Only orchestrator and prometheus. Not internal: docker publishes no
  # ports from a container whose only network is internal, and the
  # prometheus UI is published on host loopback. Fixed subnet: the
  # orchestrator refuses it on its internal port (INTERNAL_DENY_SUBNETS).
  monitoring:
    ipam:
      config:
        - subnet: 172.31.250.0/28
  # Only grafana and prometheus (never the orchestrator). Not internal, for
  # the same reason as monitoring: the grafana UI is published on host
  # loopback; so grafana has internet egress (update checks and telemetry
  # are disabled in its environment).
  grafana:
