# whisper -> orchestrator -> claude -> executor
#
# whisper      - speech-to-text (stt_service.py), internal network only
# orchestrator - gateway.py (mTLS, the only exposed port): the phone app's
#                API and its control WebSocket, elevation (lifting the
#                restrictions, approved only from the phone), history, logs.
#                command_router.py runs Claude Code headless with two MCP
#                servers: the executor's "cluster" tools and the "phone"
#                tools (phone_hub.py, loopback only). It cannot run shell
#                commands itself.
# executor     - mcp_command_server.py over HTTP, internal network only. The
#                only container that runs commands; it checks every one
#                against commands_whitelist.md.
#
# whisper and executor are on separate networks: each can talk only to the
# orchestrator, not to each other.
#
# Claude uses the same login as `claude` in your terminal: your ~/.claude is
# mounted into the orchestrator, which runs as your uid. Log in once on the
# host (`claude`, then /login), then:
#
#   docker compose up -d --build

services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    restart: unless-stopped
    # Your uid/gid: Claude writes into your ~/.claude, and certs/server.key
    # is readable only by you.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      GATEWAY_HOST: 0.0.0.0
      STT_URL: http://whisper:9000
      EXECUTOR_URL: http://executor:8000/mcp
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      # Internal server: /mcp answers loopback only, /internal/elevation
      # is what the executor reads.
      INTERNAL_HOST: 0.0.0.0
      DATA_DIR: /app/data
      # Optional PIN asked on the phone when approving a voice request to
      # lift the restrictions.
      ELEVATION_PIN: ${ELEVATION_PIN:-}
    ports:
      # Published on the VPN address only, as before.
      - "${GATEWAY_BIND:-100.99.129.107}:8443:8443"
    volumes:
      - ./certs:/app/certs:ro
      - ${HOME}/.claude:/home/app/.claude
      - orchestrator-data:/app/data
      # Tailed into the app's Logs screen.
      - ./command_audit.log:/app/command_audit.log:ro
    networks: [default, stt, exec]
    depends_on:
      whisper:
        condition: service_healthy
      executor:
        condition: service_healthy

  executor:
    build:
      context: .
      dockerfile: docker/executor.Dockerfile
    restart: unless-stopped
    # Your uid/gid: the audit log on the host is yours.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # Host header the orchestrator sends; anything else is refused.
      MCP_ALLOWED_HOSTS: "executor:*"
      ELEVATION_URL: http://orchestrator:8001/internal/elevation
      # systemd units to show on the app's Server screen, e.g. "nginx,ssh"
      MONITOR_UNITS: ${MONITOR_UNITS:-}
    volumes:
      - ./commands_whitelist.md:/app/commands_whitelist.md:ro
      - ./scripts:/app/scripts:ro
      - ./command_audit.log:/app/command_audit.log
      # The node's real name for the Server screen.
      - /etc/hostname:/host/hostname:ro
    # No published ports. Not an internal network, so run_command can still
    # SSH out to other cluster nodes.
    networks: [exec]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 10s
      timeout: 5s
      retries: 3

  whisper:
    build:
      context: .
      dockerfile: docker/stt.Dockerfile
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-small}
      STT_LANGUAGE: ${STT_LANGUAGE:-ru}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-4}
      STT_MODEL_DIR: /models
    volumes:
      - whisper-models:/models
    networks: [stt]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m  # first start downloads the Whisper model

volumes:
  whisper-models:
  orchestrator-data:

networks:
  stt:
  exec:
